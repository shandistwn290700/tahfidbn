<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tidak Terhubung ke Server</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8faf9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #1e293b;
    padding: 24px;
  }
  .card {
    max-width: 380px;
    text-align: center;
  }
  .icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: #ecfdf5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 36px; height: 36px; }
  h1 {
    font-size: 1.25rem;
    font-weight: 800;
    margin: 0 0 8px;
  }
  p {
    font-size: 0.9rem;
    color: #64748b;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  button {
    background: #10b981;
    color: white;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { background: #059669; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0" />
        <path d="M1.42 9a16 16 0 0 1 21.16 0" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
        <line x1="1" y1="1" x2="23" y2="23" stroke="#e11d48" />
      </svg>
    </div>
    <h1>Silakan hubungkan ke WiFi server</h1>
    <p>
      Aplikasi ini hanya bisa diakses saat HP terhubung ke jaringan WiFi yang sama dengan
      server sekolah. Periksa pengaturan WiFi, lalu coba lagi.
    </p>
    <button onclick="window.location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
